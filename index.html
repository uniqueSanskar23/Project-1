<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #eef2ff;
        --muted: #bac5e4;
        --cyan: #62e7ff;
        --violet: #9a7cff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
      }

      .orb {
        position: fixed;
        width: 38rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(10px);
        opacity: .32;
        pointer-events: none;
      }

      .orb--one { background: #6148ff; top: -22rem; left: -13rem; animation: drift 12s ease-in-out infinite alternate; }
      .orb--two { background: #00c8e8; right: -16rem; bottom: -25rem; animation: drift 15s ease-in-out infinite alternate-reverse; }

      main {
        width: min(92vw, 760px);
        padding: clamp(2rem, 7vw, 5rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
        box-shadow: 0 24px 80px rgba(0, 0, 0, .35), inset 0 1px rgba(255,255,255,.15);
        backdrop-filter: blur(20px);
        animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: var(--cyan);
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 11vw, 7rem);
        line-height: .95;
        letter-spacing: -.07em;
        background: linear-gradient(110deg, #fff, var(--cyan) 48%, var(--violet));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 34rem;
        margin: 1.6rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .sparkles { margin-top: 2.2rem; font-size: 1.6rem; letter-spacing: .5rem; }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(20px) scale(.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes drift {
        to { transform: translate(5rem, 3rem) scale(1.15); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb--one"></div>
    <div class="orb orb--two"></div>
    <main>
      <p class="eyebrow">A new beginning</p>
      <h1>Hello, World!</h1>
      <p>Your first page is live: clean, responsive, and ready for whatever you build next.</p>
      <div class="sparkles" aria-label="sparkles">✦ ✧ ✦</div>
      <nav aria-label="Main navigation">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</nav>
    </main>
  </body>
</html>
