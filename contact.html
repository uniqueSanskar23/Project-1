<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>Contact | Hello, World!</title>
  <style>
    :root { color-scheme:dark; --ink:#eef2ff; --muted:#bac5e4; --cyan:#62e7ff; --violet:#9a7cff; } * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:6.5rem 1.25rem 2rem; color:var(--ink); font-family:Inter,system-ui,sans-serif; background:#0b1020; } body::before { content:""; position:fixed; z-index:-1; bottom:-17rem; left:-13rem; width:36rem; aspect-ratio:1; border-radius:50%; opacity:.3; filter:blur(15px); background:#00c8e8; }
    nav { position:fixed; top:1.25rem; left:50%; display:flex; gap:.35rem; padding:.35rem; border:1px solid rgba(255,255,255,.14); border-radius:999px; background:rgba(11,16,32,.7); backdrop-filter:blur(14px); transform:translateX(-50%); } nav a { padding:.55rem .9rem; border-radius:999px; color:var(--muted); font-size:.9rem; font-weight:700; text-decoration:none; } nav a:hover,nav a[aria-current="page"] { color:var(--ink); background:rgba(255,255,255,.12); }
    main { width:min(100%,720px); margin:0 auto; padding:clamp(2rem,6vw,4.5rem); border:1px solid rgba(255,255,255,.16); border-radius:28px; background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04)); box-shadow:0 24px 80px rgba(0,0,0,.35); backdrop-filter:blur(20px); } .eyebrow { margin:0 0 .8rem; color:var(--cyan); font-size:.78rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(2.8rem,8vw,5.5rem); letter-spacing:-.06em; line-height:1; } .lead { color:var(--muted); font-size:1.1rem; line-height:1.7; }
    form { display:grid; gap:1rem; margin-top:2rem; } label { display:grid; gap:.45rem; color:var(--muted); font-size:.9rem; font-weight:700; } input,textarea { width:100%; padding:.85rem 1rem; border:1px solid rgba(255,255,255,.16); border-radius:12px; outline:none; color:var(--ink); font:inherit; background:rgba(7,12,29,.35); } input:focus,textarea:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(98,231,255,.16); } textarea { min-height:8rem; resize:vertical; } button { justify-self:start; padding:.8rem 1.15rem; border:0; border-radius:12px; color:#07101e; font:inherit; font-weight:800; cursor:pointer; background:linear-gradient(110deg,var(--cyan),var(--violet)); }
  </style>
</head>
<body>
  <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <p class="eyebrow">Say hello</p>
    <h1>Let's make something.</h1>
    <p class="lead">Send a note and we'll be in touch. This form is ready to connect to the form service or backend you choose.</p>
    <form action="#" method="post">
      <label>Name<input type="text" name="name" autocomplete="name" placeholder="Your name" required /></label>
      <label>Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required /></label>
      <label>Message<textarea name="message" placeholder="What's on your mind?" required></textarea></label>
      <button type="submit">Send message</button>
    </form>
  </main>
</body>
</html>
